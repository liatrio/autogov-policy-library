rules:
  style:
    file-length:
      # keep the production-code ceiling at the original 800; exempt test files
      # instead of raising the repo-wide max (a prior bump from 500->700->800 already
      # widened this for every .rego file to accommodate one growing test file --
      # scoping the exemption to *_test.rego avoids a third repo-wide ratchet).
      max-file-length: 800
      ignore:
        files:
          - "**/*_test.rego"
