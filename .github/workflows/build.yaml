name: Policy Library Workflow

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - .github/workflows/wf-slack-alert.yaml
      - README.md
      - renovate.json
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  # serialize main pushes so back-to-back releases don't race the cut;
  # never cancel a run mid-publish (rw-release isn't idempotent-resume)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# default-deny; jobs that publish/attest/release declare their own writes
permissions:
  contents: read

env:
  OPA_VERSION: 1.19.0
  REGAL_VERSION: 0.42.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Regal
        uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: ${{ env.REGAL_VERSION }}
      - name: Run Regal lint
        run: regal lint --format github ./policies

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
      - name: Run OPA Tests
        run: opa test -v -s ./schemas ./policies/
      - name: Check OPA Policies
        run: opa check --rego-v1 --v1-compatible -s schemas ./policies
      - name: Check release mutation config
        run: |
          fail=0
          paths="$(grep -E '^[[:space:]]+- path:' .autogov-release.yaml | sed -E 's/.*path:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/' | sort)"
          # every rule path must resolve to a real file carrying a version comment
          while IFS= read -r p; do
            [ -f "$p" ] || { echo "missing file: $p"; fail=1; continue; }
            grep -qE '^#  version: ' "$p" || { echo "no version comment: $p"; fail=1; }
          done <<< "$paths"
          # every versioned policy file must be covered by a rule
          while IFS= read -r f; do
            grep -qE '^#  version: ' "$f" || continue
            grep -qxF "$f" <<< "$paths" || { echo "uncovered file: $f"; fail=1; }
          done < <(find policies -name '*.rego' ! -name '*_test.rego' | sort)
          [ "$fail" -eq 0 ]

  build-image:
    if: github.event.pull_request.draft == false
    needs: test
    permissions:
      id-token: write
      attestations: write
      packages: write
      contents: write
      actions: read
      pull-requests: read
      artifact-metadata: write
    uses: liatrio/autogov-workflows/.github/workflows/rw-build-image.yaml@69ae7bdc931567721161895d6245a27fbab2cd06 # v1.1.5
    secrets: inherit
    with:
      registry: ghcr.io
      cert-identity: https://github.com/liatrio/autogov-workflows/.github/workflows/rw-attest-image.yaml@69ae7bdc931567721161895d6245a27fbab2cd06 # v1.1.5
      policy-data-overlay: '{"source_review_thresholds":{"min_approvals":0}}'
      release-image: false

  build-blob-offline: #blob
    if: github.event.pull_request.draft == false
    needs: test
    permissions:
      id-token: write
      attestations: write
      contents: write
      actions: read
      artifact-metadata: write
    uses: liatrio/autogov-workflows/.github/workflows/rw-build-blob-offline.yaml@69ae7bdc931567721161895d6245a27fbab2cd06 # v1.1.5
    secrets: inherit
    with:
      subject-path: |
        bundle.tar.gz
        schemas.tar.gz
      cert-identity: https://github.com/liatrio/autogov-workflows/.github/workflows/rw-attest-blob-offline.yaml@69ae7bdc931567721161895d6245a27fbab2cd06 # v1.1.5
      policy-data-overlay: '{"source_review_thresholds":{"min_approvals":0}}'
      autogov-version: ff839e23f922e176897232c5b4148dc1d4c1b983 # v1.3.0
      release-blob: false

  release:
    if: github.event.pull_request.draft == false
    needs: [build-image, build-blob-offline]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: liatrio/autogov-workflows/.github/workflows/rw-release.yaml@69ae7bdc931567721161895d6245a27fbab2cd06 # v1.1.5
    secrets: inherit
    with:
      mutations-config: .autogov-release.yaml
      autogov-version: ff839e23f922e176897232c5b4148dc1d4c1b983 # v1.3.0
      vsa-artifact-id: >-
        ${{ needs.build-image.outputs.vsa-artifact-id }},
        ${{ needs.build-blob-offline.outputs.vsa-artifact-id }}
      expected-vsa-artifact-count: 2
      blob-artifact-id: ${{ needs.build-blob-offline.outputs.blob-artifact-id }}
      expected-blob-artifact-count: 1
